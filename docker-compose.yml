# ===== 智聘云图 Docker Compose 编排 =====
# 启动: docker-compose up -d
# 查看日志: docker-compose logs -f backend
# 停止: docker-compose down
# 重新构建: docker-compose up -d --build

version: "3.9"

networks:
  zhipin-net:
    driver: bridge
    name: zhipin-net

volumes:
  zhipin-db:
    driver: local
    name: zhipin-db
  zhipin-uploads:
    driver: local
    name: zhipin-uploads
  zhipin-logs:
    driver: local
    name: zhipin-logs
  zhipin-redis:
    driver: local
    name: zhipin-redis

services:
  # ===== Redis 缓存与消息队列 =====
  redis:
    image: redis:7-alpine
    container_name: zhipin-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-zhipin123}
    ports:
      - "6379:6379"
    volumes:
      - zhipin-redis:/data
    networks:
      - zhipin-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-zhipin123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Neo4j 知识图谱数据库 =====
  neo4j:
    image: neo4j:5-community
    container_name: zhipin-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-zhipin123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_max__size=512M
      - NEO4J_dbms_memory_pagecache_size=512M
    ports:
      - "7474:7474"   # HTTP Browser
      - "7687:7687"   # Bolt
    volumes:
      - zhipin-db:/data
    networks:
      - zhipin-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ===== 后端 FastAPI 服务 =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhipin-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DATABASE_URL=mysql+pymysql://root:${DB_PASSWORD:-123456}@greatsql:3306/zhipin?charset=utf8mb4
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-zhipin123}
      - STORAGE_PATH=/app/uploads
    ports:
      - "8000:8000"
    volumes:
      - zhipin-uploads:/app/uploads
      - zhipin-logs:/app/logs
      - zhipin-db:/app/data
    networks:
      - zhipin-net
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===== 前端 Nginx 服务 =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zhipin-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - zhipin-logs:/var/log/nginx
    networks:
      - zhipin-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
